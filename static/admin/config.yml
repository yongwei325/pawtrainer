# =============================================================================
# Decap CMS configuration — "PawTrainer" dog-training site
# Docs: https://decapcms.org/docs/configuration-options/
# This editor commits Markdown into the repo; Hugo (Cloudflare Pages) rebuilds.
# =============================================================================

backend:
  name: github
  repo: yongwei325/pawtrainer
  branch: main
  # GitHub OAuth app Client ID (create a free OAuth app — see ADMIN.md).
  # The Client Secret stays in the OAuth app; Decap exchanges the token in-browser.
  client_id: "Ov231iANksrUSQab2xIq"
  # Cloudflare Pages Worker that proxies GitHub OAuth (see static/_worker.js).
  # Decap appends /auth to this URL, so the actual endpoint is /auth.
  base_url: https://pawtrainer.pages.dev

# Simple mode = save commits directly. Uncheck "Draft" + Save to publish.
publish_mode: simple

# Images uploaded in the editor are stored here and served at /images
media_folder: "static/images"
public_folder: "/images"

# Show the editor at this path
site_url: https://pawtrainer.pages.dev   # used for preview links (route A: free subdomain)

collections:
  # ---------------------------------------------------------------------------
  # Articles — the core content type
  # ---------------------------------------------------------------------------
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    format: yaml
    extension: md
    delimiter: "---"
    summary: "{{title}}"
    fields:
      - { name: title, label: "标题", widget: string, required: true }
      - { name: date, label: "发布时间", widget: datetime, required: true }
      - name: draft
        label: "草稿（发布前隐藏）"
        widget: boolean
        default: true
        hint: "写作时保持开启。关闭后保存即可发布文章。"
      - name: category
        label: "分类"
        widget: select
        default: "Puppy Basics"
        options:
          - { label: "幼犬基础", value: "Puppy Basics" }
          - { label: "行为问题", value: "Behavior Problems" }
          - { label: "指令训练", value: "Commands" }
          - { label: "装备评测", value: "Gear & Reviews" }
      - name: tags
        label: "标签"
        widget: list
        field: { name: tag, label: "标签", widget: string }
        summary: "{{fields.tag}}"
      - name: summary
        label: "摘要"
        widget: text
        hint: "显示在卡片和搜索结果中的简短摘要。"
      - name: author
        label: "作者（E-E-A-T 信号）"
        widget: object
        collapsed: false
        fields:
          - { name: name, label: "姓名", widget: string, default: "PawTrainer Editors" }
          - { name: bio, label: "简介", widget: text }
      - name: hero_image
        label: "头图"
        widget: image
        required: false
      - name: affiliate
        label: "联盟商品（可选）"
        widget: object
        required: false
        fields:
          - { name: name, label: "商品名称", widget: string }
          - { name: url, label: "联盟链接", widget: string }
          - { name: price, label: "价格", widget: string }
          - { name: note, label: "披露声明", widget: string, default: "As an Amazon Associate we earn from qualifying purchases." }
      - name: show_ads
        label: "本页显示 AdSense 广告"
        widget: boolean
        default: true
      - { name: body, label: "正文内容", widget: markdown, required: true, hint: "用 Markdown 格式写文章。" }

  # ---------------------------------------------------------------------------
  # Static pages — About / Privacy / Disclaimer (needed for AdSense compliance)
  # ---------------------------------------------------------------------------
  - name: "pages"
    label: "静态页面"
    files:
      - name: "about"
        label: "关于我们"
        file: "content/about.md"
        fields:
          - { name: title, label: "标题", widget: string, default: "About" }
          - { name: body, label: "正文内容", widget: markdown, required: true }
      - name: "privacy"
        label: "隐私政策"
        file: "content/privacy.md"
        fields:
          - { name: title, label: "标题", widget: string, default: "Privacy Policy" }
          - { name: body, label: "正文内容", widget: markdown, required: true }
      - name: "disclaimer"
        label: "免责声明"
        file: "content/disclaimer.md"
        fields:
          - { name: title, label: "标题", widget: string, default: "Medical Disclaimer" }
          - { name: body, label: "正文内容", widget: markdown, required: true }
